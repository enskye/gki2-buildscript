name: Build GKI2 Kernel 6.6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free up disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Setup environment and Repo tool
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses-dev lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig bc cpio rsync python3 kmod libelf-dev libssl-dev lz4
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+rx ~/.bin/repo
        echo ~/.bin >> $GITHUB_PATH
        
    - name: Clone kernel source
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        mkdir android-kernel && cd android-kernel
        repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6-lts --depth=1
        repo sync -j$(nproc)
        
    - name: Integrate KernelSU
      run: |
        cd android-kernel/common
        curl -LSs "https://raw.githubusercontent.com/enskye/KernelSU/main/kernel/setup.sh" | bash -s main
        cd KernelSU
        COMMITS=$(git rev-list --count HEAD)
        
        sed -i 's/0x033b/0x351/g' kernel/Makefile kernel/Kbuild 2>/dev/null || true
        sed -i 's/c371061b19d8c7d7d6133c6a9bafe198fa944e50c1b31c9d8daa8d7f1fc2d2d6/a133eaec1c9d2838dfd9ce4411ea0bcc494e1a2fec4eab3f4f675ec076897f0c/g' kernel/Makefile kernel/Kbuild 2>/dev/null || true
        
        sed -i '/-DKSU_VERSION/d' kernel/Kbuild
        echo "ccflags-y += -DKSU_VERSION=$((30000 + COMMITS))" >> kernel/Kbuild
        
        rm -rf .git

      
    - name: Integrate susfs4ksu
      run: |
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6-dev
        cp -a susfs4ksu/kernel_patches/fs/* android-kernel/common/fs/
        cp -a susfs4ksu/kernel_patches/include/linux/* android-kernel/common/include/linux/
        cd android-kernel/common
        KERNEL_PATCH=$(ls ../../susfs4ksu/kernel_patches/50_add_susfs_in_gki-*.patch | head -n 1)
        patch -p1 -F3 < "$KERNEL_PATCH"
        cd KernelSU
        KSU_PATCH=$(ls ../../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs*.patch | head -n 1)
        patch -p1 -F3 < "$KSU_PATCH"

    - name: Apply KSU Manual Hooks Patch via Git Clone
      run: |
        git clone https://github.com/enskye/kernel_patches.git patches-repo
        cd android-kernel/common
        patch -p1 -F3 < ../../patches-repo/hooks/ksu-manual-hooks.patch

    - name: Fix KernelSU Clang Compiler Warnings
      run: |
        sed -i 's/if (security_dump_masked_av_fn)/if (\&security_dump_masked_av_fn)/g' android-kernel/common/drivers/kernelsu/feature/selinux_hide.c
        sed -i 's/if (context_struct_compute_av_fn) {/if (\&context_struct_compute_av_fn) {/g' android-kernel/common/drivers/kernelsu/feature/selinux_hide.c

    - name: Configure GKI dependencies, Mountify & SUSFS Configs
      run: |
        cd android-kernel
        sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' common/BUILD.bazel
        rm -f common/android/abi_gki_protected_exports_*
        sed -i 's/check_defconfig//' ./common/build.config.gki
        echo "CONFIG_OVERLAY_FS=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_TMPFS_XATTR=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_SUSFS=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> common/arch/arm64/configs/gki_defconfig
        
    - name: Apply Custom Branding and Real Build Date
      run: |
        cd android-kernel
        echo "-kyernel" > common/localversion
        find build/ -type f \( -name "*.sh" -o -name "*.bzl" -o -name "*.py" \) -exec sed -i 's/-maybe-dirty//g' {} + || true
        sed -i 's/res="$res${dirty}"/res="$res"/g' common/scripts/setlocalversion || true
        BUILD_DATE=$(LC_ALL=C date -u +"%a %b %d %H:%M:%S UTC %Y")
        [ -f common/scripts/mkcompile_h ] && sed -i "s/.*SOURCE_DATE_EPOCH.*/BUILD_DATE=\"$BUILD_DATE\"/g" common/scripts/mkcompile_h
        [ -f common/init/Makefile ] && sed -i "s/^build-timestamp =.*/build-timestamp = $BUILD_DATE/g" common/init/Makefile

        
    - name: Setup Kernel Signing Keys
      run: |
        cd android-kernel
        mkdir -p signing
        if [[ -n "${{ secrets.KERNEL_SIGNING_KEY }}" && -n "${{ secrets.KERNEL_SIGNING_CERT }}" ]]; then
          echo "${{ secrets.KERNEL_SIGNING_KEY }}" > signing/kernel_key.pem
          echo "${{ secrets.KERNEL_SIGNING_CERT }}" > signing/kernel_cert.pem
          openssl rsa -in signing/kernel_key.pem -check -noout || exit 1
          openssl x509 -in signing/kernel_cert.pem -text -noout >/dev/null || exit 1
        else
          openssl genrsa -out signing/kernel_key.pem 4096
          openssl req -new -x509 -key signing/kernel_key.pem -out signing/kernel_cert.pem -days 365 -subj "/C=LT/ST=Dev/L=Build/O=Kyernel/CN=kyernel-custom"
        fi
                
    - name: Build Kernel
      run: |
        cd android-kernel
        CURRENT_EPOCH=$(date +%s)
        BUILD_DATE=$(LC_ALL=C date -u +"%a %b %d %H:%M:%S UTC %Y")
        KEY_PATH="$(pwd)/signing/kernel_key.pem"
        CERT_PATH="$(pwd)/signing/kernel_cert.pem"
        tools/bazel run \
          --action_env="SOURCE_DATE_EPOCH=$CURRENT_EPOCH" \
          --action_env="KBUILD_BUILD_TIMESTAMP=$BUILD_DATE" \
          --action_env="KBUILD_SIGN_KEY=$KEY_PATH" \
          --action_env="KBUILD_SIGN_CERT=$CERT_PATH" \
          --action_env="KSU_EXPECTED_SIZE=${{ secrets.KSU_EXPECTED_SIZE }}" \
          --action_env="KSU_EXPECTED_HASH=${{ secrets.KSU_EXPECTED_HASH }}" \
          //common:kernel_aarch64_dist \
          -- --destdir=out/dist

    - name: Prepare AnyKernel3
      run: |
        cd android-kernel
        git clone https://github.com/enskye/AnyKernel3.git AK3
        rm -rf AK3/.git AK3/README.md
        if [ -f "out/dist/Image" ]; then
          lz4 -9 -f out/dist/Image AK3/Image.lz4
        else
          cp out/dist/Image.lz4 AK3/
        fi
        echo "ZIP_NAME=kyernel-gki2-6.6-$(date +%Y%m%d)" >> $GITHUB_ENV

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: android-kernel/AK3/*
